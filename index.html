<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斜め分割サムネメーカー</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--pn:#fff;--ink:#23211f;--mut:#7b766d;--ln:#ddd6c8;--ac:#d9482b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161519;--pn:#212025;--ink:#eeebe6;--mut:#9b97a0;--ln:#37353d;--ac:#ff7a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161519;--pn:#212025;--ink:#eeebe6;--mut:#9b97a0;--ln:#37353d;--ac:#ff7a5c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
.app{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.stage{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{max-width:100%;max-height:72vh;touch-action:none;border-radius:6px;box-shadow:0 2px 14px #0003;cursor:crosshair}
.hint{color:var(--mut);font-size:12px;text-align:center}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px}
h1{font-size:16px;margin:0 0 4px}h2{font-size:12px;color:var(--mut);margin:0 0 8px;letter-spacing:.04em}
label{display:flex;align-items:center;gap:8px;margin:6px 0}label span{width:92px;flex:none;color:var(--mut);font-size:12px}
input[type=range]{flex:1;min-width:0}
select,input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:5px 6px;font:inherit;min-width:0}
input[type=number]{width:70px}
button{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{display:flex;gap:6px;flex-wrap:wrap}
.t{width:62px;border:2px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--bg)}
.t.on{border-color:var(--ac)}.t img{width:100%;height:46px;object-fit:cover;display:block}
.t div{display:flex;justify-content:space-between}.t b{font-weight:400;cursor:pointer;flex:1;text-align:center;font-size:12px;padding:1px 0}
#ov{position:fixed;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:9;color:#fff}
#ov img{max-width:100%;max-height:75vh}
</style></head><body>
<div class="app">
<div class="stage"><canvas id="cv"></canvas>
<div class="hint">丸いハンドルをドラッグで区切り線を移動・傾け / 画像をドラッグで位置調整 / ホイールでズーム</div></div>
<div class="side">
<div class="card"><h1>斜め分割サムネメーカー</h1>
<div class="row"><button class="p" id="add">画像を追加(2枚〜)</button><span class="hint">ドロップも可</span></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<div class="th" id="th" style="margin-top:10px"></div></div>
<div class="card"><h2>キャンバス</h2>
<label><span>比率</span><select id="pre"><option value="1080,1080">1:1</option><option value="1280,960">4:3</option><option value="960,1280">3:4</option><option value="1280,720">16:9</option><option value="720,1280">9:16</option><option value="1280,640">2:1</option></select></label>
<label><span>サイズ(px)</span><input type="number" id="w" value="1080" min="100" max="4000"> × <input type="number" id="h" value="1080" min="100" max="4000"></label>
<label><span>背景/区切り色</span><input type="color" id="bg" value="#ffffff"></label></div>
<div class="card"><h2>配置</h2>
<label><span>パターン</span><select id="mode"><option value="rand">ランダム</option><option value="grid">均等グリッド</option><option value="big">大1枚＋小</option><option value="v">縦ストライプ</option><option value="h">横ストライプ</option></select></label>
<div class="row"><button class="p" id="auto">自動配置</button><button id="shuf">画像をシャッフル</button></div>
<label><span>縦区切りの傾き</span><input type="range" id="kv" min="-35" max="35" value="0"></label>
<label><span>横区切りの傾き</span><input type="range" id="kh" min="-35" max="35" value="0"></label>
<label><span>区切りの太さ</span><input type="range" id="gap" min="0" max="40" value="8"></label>
<label><span>選択画像ズーム</span><input type="range" id="zm" min="100" max="400" value="100"></label>
<div class="row"><button id="rst">傾きをリセット</button><button id="hd">ハンドル表示切替</button></div></div>
<div class="card"><h2>書き出し</h2><div class="row"><select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option></select><button class="p" id="exp">保存する</button></div></div>
</div></div>
<div id="ov"><img id="oi" alt=""><div>長押し／右クリックで画像を保存できます</div><button id="oc">閉じる</button></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
let W=1080,H=1080,items=[],L=null,sel=-1,drag=null,showH=true;
const val=id=>+$('#'+id).value;
function dist(n,R){const a=Array(R).fill(Math.floor(n/R));for(let i=0;i<n%R;i++)a[i]++;return a}
function gen(){
 const mode=$('#mode').value,n=Math.max(items.length,2);let counts,rw;
 if(mode==='v')counts=[n];else if(mode==='h')counts=Array(n).fill(1);
 else if(mode==='big'){counts=n==2?[1,1]:[1,n-1];rw=[1.7,1]}
 else if(mode==='grid')counts=dist(n,Math.max(1,Math.round(Math.sqrt(n*H/W))));
 else{const R=n==2?1+(Math.random()<.5?1:0):1+Math.floor(Math.random()*Math.min(3,n));counts=dist(n,R).sort(()=>Math.random()-.5)}
 rw=rw||counts.map(()=>mode==='rand'?rnd(.7,1.4):1);
 const cum=(w,mk)=>{const t=w.reduce((a,b)=>a+b,0);let a=0;const o=[mk(0)];for(let i=0;i<w.length-1;i++){a+=w[i]/t;o.push(mk(a))}o.push(mk(1));return o};
 L={B:cum(rw,v=>({l:v,r:v})),rows:counts.map(c=>cum(Array.from({length:c},()=>mode==='rand'?rnd(.7,1.5):1),v=>({t:v,b:v})))};
 if(mode==='rand'){const o=[0,0,-18,18,-28,28];$('#kv').value=o[Math.floor(Math.random()*6)];$('#kh').value=o[Math.floor(Math.random()*6)]}
 skew();
}
function skew(){
 const kv=val('kv')/100,kh=val('kh')/100;
 L.rows.forEach(D=>D.forEach((d,j)=>{if(j&&j<D.length-1){const c=(d.t+d.b)/2;d.t=clamp(c+kv/2,.02,.98);d.b=clamp(c-kv/2,.02,.98)}}));
 L.B.forEach((b,i)=>{if(i&&i<L.B.length-1){const c=(b.l+b.r)/2;b.l=clamp(c-kh/2,.02,.98);b.r=clamp(c+kh/2,.02,.98)}});
 draw();
}
function polys(){const P=[];L.rows.forEach((D,r)=>{const T=L.B[r],Bt=L.B[r+1];const top=x=>(T.l+(T.r-T.l)*x)*H,bot=x=>(Bt.l+(Bt.r-Bt.l)*x)*H;
 for(let j=0;j<D.length-1;j++){const a=D[j],b=D[j+1];P.push([[a.t*W,top(a.t)],[b.t*W,top(b.t)],[b.b*W,bot(b.b)],[a.b*W,bot(a.b)]])}});return P}
function handles(){const hs=[];
 L.B.forEach((b,i)=>{if(i&&i<L.B.length-1){hs.push({k:'bl',i,x:0,y:b.l*H});hs.push({k:'br',i,x:W,y:b.r*H})}});
 L.rows.forEach((D,r)=>{const T=L.B[r],Bt=L.B[r+1];D.forEach((d,j)=>{if(j&&j<D.length-1){
  hs.push({k:'dt',r,j,x:d.t*W,y:(T.l+(T.r-T.l)*d.t)*H});hs.push({k:'db',r,j,x:d.b*W,y:(Bt.l+(Bt.r-Bt.l)*d.b)*H})}})});return hs}
function mv(h,x,y){
 if(h.k=='bl'||h.k=='br'){const f=h.k=='bl'?'l':'r',B=L.B;B[h.i][f]=clamp(y/H,B[h.i-1][f]+.05,B[h.i+1][f]-.05)}
 else{const f=h.k=='dt'?'t':'b',D=L.rows[h.r];D[h.j][f]=clamp(x/W,D[h.j-1][f]+.04,D[h.j+1][f]-.04)}
}
function inP(p,x,y){let c=false;for(let i=0,j=3;i<4;j=i++){const[a,b]=p[i],[d,e]=p[j];if((b>y)!=(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c}
function path(p){ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()}
function draw(exp){
 const bg=$('#bg').value,g=val('gap')*W/1080;ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const P=polys();
 P.forEach((p,i)=>{const it=items[i];ctx.save();path(p);ctx.clip();
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),bw=x1-x0,bh=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(it){const sc=Math.max(bw/it.img.width,bh/it.img.height)*it.s,dw=it.img.width*sc,dh=it.img.height*sc,mx=Math.max(0,(dw-bw)/2),my=Math.max(0,(dh-bh)/2);
   it.ox=clamp(it.ox,-mx,mx);it.oy=clamp(it.oy,-my,my);ctx.drawImage(it.img,cx+it.ox-dw/2,cy+it.oy-dh/2,dw,dh)}
  else{ctx.fillStyle='#8884';ctx.fillRect(x0,y0,bw,bh);ctx.fillStyle='#888';ctx.font=(W/12)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',cx,cy)}
  ctx.restore()});
 if(g>0){ctx.strokeStyle=bg;ctx.lineWidth=g;ctx.lineJoin='miter';P.forEach(p=>{path(p);ctx.stroke()})}
 if(exp)return;
 if(sel>=0&&P[sel]){ctx.strokeStyle='#d9482b';ctx.lineWidth=W/200;path(P[sel]);ctx.stroke()}
 if(showH){const r=W/70;handles().forEach(h=>{ctx.beginPath();ctx.arc(h.x,h.y,r,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=r/3;ctx.strokeStyle='#d9482b';ctx.stroke()})}
 if(!items.length){ctx.fillStyle='#0008';ctx.fillRect(0,H/2-W/14,W,W/7);ctx.fillStyle='#fff';ctx.font=(W/24)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('画像をドロップ / 追加してください',W/2,H/2)}
}
function resize(){W=clamp(val('w')||1080,100,4000);H=clamp(val('h')||1080,100,4000);cv.width=W;cv.height=H;draw()}
function thumbs(){const t=$('#th');t.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='t'+(i==sel?' on':'');
 d.innerHTML='<img src="'+it.url+'" alt=""><div><b data-a="l">◀</b><b data-a="x">✕</b><b data-a="r">▶</b></div>';
 d.onclick=e=>{const a=e.target.dataset.a;if(a=='x'){items.splice(i,1);sel=-1;gen();thumbs()}
  else if(a){const j=a=='l'?i-1:i+1;if(j>=0&&j<items.length){[items[i],items[j]]=[items[j],items[i]];sel=j}thumbs();draw()}
  else{sel=i;$('#zm').value=it.s*100;thumbs();draw()}};t.appendChild(d)})}
async function add(files){
 const fs=[...files].filter(f=>f.type.startsWith('image/'));
 const ims=await Promise.all(fs.map(f=>new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>res({img:im,url:u,s:1,ox:0,oy:0});im.onerror=()=>res(null);im.src=u})));
 ims.filter(Boolean).forEach(i=>items.push(i));gen();thumbs()}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.onpointerdown=e=>{const[x,y]=pt(e),rad=22*W/cv.getBoundingClientRect().width;
 const h=showH&&handles().find(h=>Math.hypot(h.x-x,h.y-y)<rad);
 if(h)drag={h};else{const i=polys().findIndex(p=>inP(p,x,y));sel=i;drag=i>=0?{i,x,y}:null;if(i>=0&&items[i])$('#zm').value=items[i].s*100;thumbs()}
 cv.setPointerCapture(e.pointerId);draw()};
cv.onpointermove=e=>{if(!drag)return;const[x,y]=pt(e);
 if(drag.h)mv(drag.h,x,y);else if(items[drag.i]){items[drag.i].ox+=x-drag.x;items[drag.i].oy+=y-drag.y;drag.x=x;drag.y=y}draw()};
cv.onpointerup=()=>{drag=null};
cv.addEventListener('wheel',e=>{const[x,y]=pt(e),i=polys().findIndex(p=>inP(p,x,y));if(i<0||!items[i])return;e.preventDefault();
 items[i].s=clamp(items[i].s*(e.deltaY<0?1.08:.93),1,4);if(i==sel)$('#zm').value=items[i].s*100;draw()},{passive:false});
$('#add').onclick=()=>$('#file').click();$('#file').onchange=e=>{add(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});
$('#pre').onchange=e=>{const[w,h]=e.target.value.split(',');$('#w').value=w;$('#h').value=h;resize()};
['w','h'].forEach(i=>$('#'+i).onchange=resize);$('#bg').oninput=()=>draw();$('#gap').oninput=()=>draw();
$('#kv').oninput=skew;$('#kh').oninput=skew;$('#mode').onchange=gen;$('#auto').onclick=gen;
$('#shuf').onclick=()=>{items.sort(()=>Math.random()-.5);sel=-1;thumbs();draw()};
$('#zm').oninput=e=>{if(items[sel]){items[sel].s=e.target.value/100;draw()}};
$('#rst').onclick=()=>{$('#kv').value=0;$('#kh').value=0;skew()};
$('#hd').onclick=()=>{showH=!showH;draw()};
$('#oc').onclick=()=>$('#ov').style.display='none';
$('#exp').onclick=async()=>{
 draw(true);const jp=$('#fmt').value=='jpg',blob=await new Promise(r=>cv.toBlob(r,jp?'image/jpeg':'image/png',.92));draw();
 const name='thumbnail.'+(jp?'jpg':'png');let d=null;
 try{d=window.claude&&await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data:blob});return}catch(e){if(e&&e.code=='declined')return}}
 $('#oi').src=URL.createObjectURL(blob);$('#ov').style.display='flex'};
resize();gen();
</script></body></html>
